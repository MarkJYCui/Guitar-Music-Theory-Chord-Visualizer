name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        # Removed the -L flag below to prevent redirect loops
        run: curl -s https://guitar-music-theory-chord-visualizer-h4zgzqyisvfgs98lapfwjb.streamlit.app > /dev/null
